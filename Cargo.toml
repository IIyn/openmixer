[package]
name = "openmixer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
env_logger = "0.11.11"
gpui = "0.2.2"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
log = "0.4.35"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
